version: '3.8'

services:
  echocare-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

  echocare-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
