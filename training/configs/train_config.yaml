# EchoCare AI: Supervised Fine-Tuning Hyperparameters
# Target: Qwen/Qwen2.5-0.5B-Instruct with LoRA adapters

model:
  base_model_name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"
  torch_dtype: "bfloat16" # fallback to "float32" on pure CPU
  trust_remote_code: true
  device_map: "auto"

dataset:
  train_file: "./training/data/train.jsonl"
  val_file: "./training/data/val.jsonl"
  test_file: "./training/data/test.jsonl"
  max_seq_length: 1024
  packing: false

peft:
  method: "lora"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./models/echocare-lora-adapter"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 5
  eval_strategy: "steps"
  eval_steps: 10
  save_strategy: "steps"
  save_steps: 10
  save_total_limit: 2
  seed: 42
  fp16: false
  bf16: false # auto-enabled if CUDA supports bfloat16
  gradient_checkpointing: true
  report_to: "none"
